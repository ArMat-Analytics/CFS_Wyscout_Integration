[project]
name = "cfs-wyscout-integration"
version = "0.1.0"
requires-python = ">=3.14"

# ---------------------------------------------------------------------------
# Ruff — linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
    ".venv",
    "venv",
    "node_modules",
    "__pycache__",
    "*.ipynb",
    "webapp/frontend",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501", "E402", "E701", "E702", "E712", "E721", "E731", "E741",
    "W291", "W292", "W293",
    "F401", "F541", "F841",
]

