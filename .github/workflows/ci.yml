# =============================================================================
# CI — Lint, Test, Coverage, Code Quality, Accessibility
# =============================================================================
# Triggers on push and pull_request to main.
# Jobs: backend (Python), frontend (Node), sonarcloud, lighthouse.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend: Python lint + test + coverage ──────────────────────────────
  backend:
    name: 🐍 Backend (lint + test + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Core analytics dependencies (shared across H1–H4)
          pip install -r H1_Space_Control_and_Value/requirements.txt
          pip install -r H2_Decision_Quality/requirements.txt
          pip install -r H4_Player_Similarity/requirements.txt
          # Webapp backend dependencies
          pip install -r webapp/backend/requirements.txt
          # CI tooling
          pip install ruff pytest pytest-cov

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=H1_Space_Control_and_Value/src \
            --cov=H2_Decision_Quality/src \
            --cov=H4_Player_Similarity/src \
            --cov-report=xml \
            --cov-report=term

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─── Frontend: Node lint + build ─────────────────────────────────────────
  frontend:
    name: ⚛️ Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  # ─── SonarCloud (optional, non-blocking) ─────────────────────────────────
  sonarcloud:
    name: 🔍 SonarCloud Analysis
    runs-on: ubuntu-latest
    # Only run on push to main or PRs from the same repo (not external forks)
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─── Lighthouse CI (PR only, non-blocking) ───────────────────────────────
  lighthouse:
    name: 🔦 Lighthouse CI
    runs-on: ubuntu-latest
    needs: frontend
    if: github.event_name == 'pull_request'
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Install and build frontend
        working-directory: webapp/frontend
        run: |
          npm ci
          npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: webapp/frontend/lighthouserc.json
          uploadArtifacts: true
